[package]
name = "dado-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI binary and entrypoints for dado"

[lints]
workspace = true

[[bin]]
name = "dado"
path = "src/main.rs"

[dependencies]
gaugeblock-workspace = "0.1.0-beta.1"
dado-core = { path = "../dado-core", version = "0.1.0-beta.4" }
dado-mcp = { path = "../dado-mcp", version = "0.1.0-beta.4" }
gaugeblock-contracts = "0.1.0-beta.1"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
