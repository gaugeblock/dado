[package]
name = "dado-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI binary and entrypoints for dado"

[lints]
workspace = true

[[bin]]
name = "dado"
path = "src/main.rs"

[dependencies]
dado-core = { path = "../dado-core", version = "0.1.0-beta.4" }
dado-mcp = { path = "../dado-mcp", version = "0.1.0-beta.4" }
chalkline-core = "0.1.0-beta.2"
miter-engine = "0.1.0-alpha.3"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
