[package]
name = "dado-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library, AST pattern engine, typed hole parser, and polyglot codegen for dado"

[lints]
workspace = true

[dependencies]
# Shared wire contracts; resolved locally through the meta-harness [patch.crates-io] mapping.
gaugeblock-syntax = { path = "../../../common/crates/gaugeblock-syntax", version = "0.1.0-beta.1" }
gaugeblock-contracts = "0.1.0-beta.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
thiserror = "2.0"

[dev-dependencies]
tracing = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
tempfile = "3.10"

