[[mixins]]
mixin_id = "rust.mixin.tracing_instrument"
language = "rust"
target_hole_id = "body"
envelope_template = """
let _span = tracing::info_span!(?[span_name: &str @ expression]).entered();
?[__inner__]
"""
required_imports = ["use tracing::info_span;"]

[[mixins.additional_holes]]
hole_id = "span_name"
expected_type = "&str"
ast_node_kind = "expression"
max_tokens = 32
allow_literals = true

[mixins.canonical_example_fills]
span_name = "\"handler\""


