[[patterns]]
pattern_id = "ts.vite.api_hook.v1"
language = "typescript"
description = "Vite/React custom API hook with async state"
template_source = """
import { useState, useEffect } from "react";

export function ?[hook_name: Identifier @ identifier](endpoint: string) {
  const [data, setData] = useState<?[data_type: Type @ type] | null>(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    fetch(endpoint)
      .then((res) => res.json())
      .then((json) => {
        setData(json);
        setLoading(false);
      });
  }, [endpoint]);

  return { data, loading };
}
"""
required_imports = ["import { useState, useEffect } from \"react\";"]

