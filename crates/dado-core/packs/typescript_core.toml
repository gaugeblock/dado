language = "typescript"
description = "Typed fetch client with error handling"
template_source = """
export async function ?[fn_name: Identifier @ identifier](url: string): Promise<?[resp_type: Type @ type]> {
  const res = await fetch(url);
  if (!res.ok) {
    throw new Error(`Request failed with status ${res.status}`);
  }
  return await res.json();
}
"""
