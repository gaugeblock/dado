[[patterns]]
pattern_id = "ts.state.discriminated_reducer.v1"
language = "typescript"
description = "Discriminated union state and action reducer"
template_source = """
export type ?[action_type: Identifier @ identifier] =
  | { type: "RESET" }
  | { type: "SET_ID"; payload: string };

export interface ?[state_type: Identifier @ identifier] {
  id: string | null;
}

export function ?[reducer_name: Identifier @ identifier](state: ?[state_param_type: Identifier @ identifier], action: ?[action_param_type: Identifier @ identifier]): ?[state_return_type: Identifier @ identifier] {
  switch (action.type) {
    case "RESET":
      return { id: null };
    case "SET_ID":
      return { id: action.payload };
    default:
      return state;
  }
}
"""
